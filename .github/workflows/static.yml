<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600&family=Dancing+Script&display=swap" rel="stylesheet">

<style>

body {
    background-color: #e6dfc8;
    margin: 0;
    padding: 40px;
}

.carta-container {
    max-width: 700px;
    margin: auto;
    background: #fffdf5;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
    border: 1px solid #e0d8b0;
}

.titulo {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.data {
    text-align: left;
    font-family: 'Dancing Script', cursive;
    font-size: 20px;
    margin-bottom: 25px;
    color: #555;
}

.apr {
    font-family: 'Dancing Script', cursive;
    font-size: 26px;
    margin-bottom: 20px;
}

.carta {
    font-family: 'Dancing Script', cursive;
    font-size: 24px;
    line-height: 1.6;
    text-align: justify;
}

.despedida {
    font-family: 'Dancing Script', cursive;
    font-size: 22px;
    margin-top: 40px;
    text-align: right;
}

</style>
</head>

<body>

<div class="carta-container">

    <h1 class="titulo">Carta para mim</h1>

    <div class="data">Barra Velha, 19 de Março de 2026</div>

    <div class="apr">Caro eu do futuro,</div>

    <p class="carta">
        Espero que você ainda se lembre de como tudo começou: dos sons desafinados,
        das mãos inseguras e da estranheza de segurar o violoncelo pela primeira vez.
        Hoje, enquanto escrevo, ainda estou aprendendo, errando bastante e tentando
        encontrar beleza em cada tentativa imperfeita.
        <br><br>
        Quero que você não esqueça da paciência que está construindo agora,
        nem da persistência que te faz continuar mesmo quando parece difícil demais.
        Cada pequena evolução tem sido uma vitória silenciosa, e espero que você
        ainda valorize isso.
        <br><br>
        Se você já toca melhor — e eu acredito que sim —, não se esqueça de olhar
        para trás com carinho. Porque foi aqui, nesse começo meio caótico,
        que tudo realmente começou a fazer sentido.
    </p>

    <div class="despedida">
        Com esperança,<br>
        seu eu do passado
    </div>

</div>

</body>
</html>
